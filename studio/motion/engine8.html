<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;src:url(assets/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Inter;src:url(assets/Inter.ttf);font-weight:100 900}
:root{--snow:#f4faff;--ink:#0b132b;--ink2:#4a5568;--blue:#0066ff;--ice:#e0f2fe;--sky:#8fbaff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b132b}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
canvas#gl{position:absolute;inset:0;width:1080px;height:1920px}
#ov{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;left:70px;right:70px;text-align:center;font-family:Montserrat;font-weight:800;letter-spacing:-.045em;line-height:1.0;will-change:transform,opacity}
.big{font-size:150px}.mid{font-size:92px}.sm{font-size:64px}
.w{color:#fff}.k{color:var(--ink)}.a{color:var(--blue)}.as{color:var(--sky)}
.pill{display:inline-block;padding:26px 54px;border-radius:999px;background:var(--ink);color:#fff;font-family:Inter;font-weight:700;font-size:54px;letter-spacing:-.01em}
#cap{position:absolute;left:90px;right:90px;top:1390px;text-align:center;font-family:Inter;font-weight:800;font-size:58px;line-height:1.18;letter-spacing:-.01em}
#cap span{display:inline-block;margin:0 .14em;transition:none}
.capd #cap span{color:rgba(255,255,255,.5)} .capd #cap span.on{color:#fff}
.capl #cap span{color:rgba(11,19,43,.4)} .capl #cap span.on{color:var(--ink)}
.capl #cap span.on.k2{color:var(--blue)} .capd #cap span.on.k2{color:var(--sky)}
#mark{position:absolute;left:50%;top:1215px;width:88px;margin-left:-44px}
</style>
<script src="node_modules/three/build/three.min.js"></script>
</head><body><div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div id="ov"></div></div>
<script>
// ---------------------------------------------------------------- outils
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
// cubic-bezier(.16,1,.3,1) (entrées) en forme fermée approchée par easeOutExpo, sorties en easeInCubic
const eOut=t=>t>=1?1:1-Math.pow(2,-10*clamp(t));
const eIn=t=>{t=clamp(t);return t*t*t};
const eIO=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
// ressort amorti, dépassement minimal
const spring=t=>{t=Math.max(0,t);return 1-Math.exp(-7*t)*Math.cos(9*t)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
let C=null; // config (mots, temps)
const W=i=>C.words[i].start; // temps du mot i
// ---------------------------------------------------------------- three.js
const canvas=document.getElementById('gl');
const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});R.setClearColor(0x000000,0);
R.setPixelRatio(1);R.setSize(1080,1920,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,1080/1920,.1,100);
const hemi=new THREE.HemisphereLight(0xdfeaff,0x0b132b,.55);S.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,1.25);key.position.set(3,8,5);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;key.shadow.radius=6;key.shadow.bias=-.0004;S.add(key);
const rim=new THREE.PointLight(0x3d8bff,0,18);rim.position.set(-3,3,-2);S.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.45}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);

function rrShape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function slab(w,h,d,r,mat){const g=new THREE.ExtrudeGeometry(rrShape(w,h,r),{depth:d,bevelEnabled:true,bevelThickness:.02,bevelSize:.02,bevelSegments:4,curveSegments:10});g.translate(0,0,-d/2);g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m}
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return {c,x,t,draw}}
function face(w,h,T){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:T.t,toneMapped:false,transparent:true}));m.rotation.x=-Math.PI/2;return m}
const ck=(x,cx,cy,sz,col)=>{x.save();x.strokeStyle=col;x.lineWidth=sz*.16;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(cx-sz*.32,cy+sz*.02);x.lineTo(cx-sz*.08,cy+sz*.26);x.lineTo(cx+sz*.34,cy-sz*.24);x.stroke();x.restore()};
const rr=(x,X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};

// --- téléphone
const phone=new THREE.Group();S.add(phone);
const body=slab(1.5,3.1,.16,.22,new THREE.MeshStandardMaterial({color:0x1a2236,roughness:.35,metalness:.6}));phone.add(body);
const PT=tex(600,1240);const pscreen=face(1.38,2.98,PT);pscreen.position.y=.105;phone.add(pscreen);
let notifs=[];
function drawPhone(clock,ns,lit){const x=PT.x;x.clearRect(0,0,600,1240);
  const g=x.createLinearGradient(0,0,0,1240);g.addColorStop(0,lit?'#0d1d44':'#0a1226');g.addColorStop(1,'#050a17');x.fillStyle=g;rr(x,0,0,600,1240,70);x.fill();
  x.fillStyle='#fff';x.textAlign='center';x.font='800 150px Montserrat';x.fillText(clock,300,300);
  x.font='600 34px Inter';x.fillStyle='rgba(255,255,255,.6)';x.fillText('lundi',300,355);
  ns.forEach((n,i)=>{const y=430+i*150-(1-n.k)*60;x.globalAlpha=n.k;x.fillStyle='rgba(255,255,255,.14)';rr(x,36,y,528,128,30);x.fill();
    x.fillStyle=n.c;rr(x,62,y+30,68,68,18);x.fill();x.fillStyle='#fff';x.font='800 34px Inter';x.textAlign='left';x.fillText(n.t,152,y+58);
    x.font='500 28px Inter';x.fillStyle='rgba(255,255,255,.62)';x.fillText(n.s,152,y+98);x.textAlign='center';x.globalAlpha=1});
  PT.t.needsUpdate=true}

// --- cartes de tâches
const CARDS=[{t:'Relances',s:'à envoyer',ic:'@'},{t:'Devis',s:'à chiffrer',ic:'€'},{t:'Factures',s:'à éditer',ic:'#'},{t:'Tableaux',s:'à mettre à jour',ic:'▦'}];
const cards=CARDS.map((c,i)=>{const g=new THREE.Group();S.add(g);
  const b=slab(2.3,1.05,.12,.16,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5,metalness:0}));g.add(b);
  const T=tex(920,420);const f=face(2.2,1.0,T);f.position.y=.085;g.add(f);
  c.T=T;c.g=g;c.done=0;return c});
function drawCard(c,done,dark){const x=c.T.x;x.clearRect(0,0,920,420);
  x.fillStyle=done>0?`rgba(0,102,255,${.1*done})`:'rgba(0,0,0,0)';rr(x,0,0,920,420,56);x.fill();
  x.fillStyle=done>.5?'#0066ff':'#e0f2fe';rr(x,52,110,200,200,48);x.fill();
  x.fillStyle='#0066ff';x.textAlign='center';x.font='800 120px Montserrat';if(done>.5)ck(x,152,210,150,'#fff');else x.fillText(c.ic,152,252);
  x.textAlign='left';x.fillStyle='#0b132b';x.font='800 96px Montserrat';x.fillText(c.t,300,205);
  x.font='600 52px Inter';x.fillStyle=done>.5?'#0059e0':'#4a5568';x.fillText(done>.5?'automatique':c.s,302,285);
  c.T.t.needsUpdate=true}

// --- tuile « ton outil »
const tool=new THREE.Group();S.add(tool);
const tb=slab(3.2,3.9,.18,.3,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.42,metalness:0}));tool.add(tb);
const TT=tex(800,975);const tf=face(3.06,3.76,TT);tf.position.y=.115;tool.add(tf);
function drawTool(k){const x=TT.x;x.clearRect(0,0,800,975);
  x.fillStyle='#0b132b';x.font='800 64px Montserrat';x.textAlign='left';x.fillText('Ton outil',70,130);
  x.fillStyle='#4a5568';x.font='600 34px Inter';x.fillText('tourne pendant que tu vis',72,182);
  CARDS.forEach((c,i)=>{const y=250+i*170,p=clamp(k*4-i);x.fillStyle='#f4faff';rr(x,60,y,680,138,34);x.fill();
    x.fillStyle=p>.5?'#0066ff':'#e0f2fe';rr(x,84,y+29,80,80,22);x.fill();x.fillStyle='#0066ff';x.textAlign='center';x.font='800 52px Montserrat';if(p>.5)ck(x,124,y+69,62,'#fff');else x.fillText(c.ic,124,y+88);
    x.textAlign='left';x.fillStyle='#0b132b';x.font='800 48px Montserrat';x.fillText(c.t,190,y+86);
    x.fillStyle='#0059e0';x.font='700 30px Inter';x.globalAlpha=p;x.textAlign='right';x.fillText('auto',712,y+84);x.globalAlpha=1});
  TT.t.needsUpdate=true}

// ---------------------------------------------------------------- overlays DOM
const ov=document.getElementById('ov');
function el(cls,html,top){const d=document.createElement('div');d.className='t '+cls;d.innerHTML=html;d.style.top=top+'px';ov.appendChild(d);return d}
let O={};
function show(d,t,a,b,dy=60){ // entrée easeOut sur 0.45 s, sortie 2x plus rapide
  const i=eOut(seg(t,a,a+.45)),o=eIn(seg(t,b-.22,b));const v=t<a||t>b?0:i*(1-o);
  d.style.opacity=v;d.style.transform=`translateY(${(1-i)*dy+o*-30}px) scale(${.96+.04*i})`}

// ---------------------------------------------------------------- build + render
function build(cfg){C=cfg;ov.innerHTML='';
  O.h1=el('big w','22&nbsp;h.',250);
  O.h2=el('mid w','Encore sur<br>tes <span class="as">mails&nbsp;?</span>',410);
  O.m1=el('mid w','Pas ton métier.',300);
  O.m2=el('sm w','Mais personne d\'autre<br>ne le fait.',420);
  O.p1=el('mid w','Et le pire&nbsp;?',300);
  O.p2=el('mid w','Tout ça peut tourner<br><span style="color:#0b132b">sans toi.</span>',300);
  O.s1=el('mid k','Tes tâches<br>répétitives',270);
  O.s2=el('mid a','→ un outil simple.',470);
  O.f1=el('big k','Tu as mieux<br>à <span class="a">faire.</span>',300);
  O.c1=el('mid k','Décris<br><span class="a">ton problème</span>',300);
  O.c2=el('sm','<span class="pill">osalfred.com</span>',560);
  O.c3=el('sm k','Ta feuille de route<br><span class="a">sous 48 h.</span>',1370);
  const cap=document.createElement('div');cap.id='cap';ov.appendChild(cap);O.cap=cap;
  
  // phrases de sous-titres (indices de mots)
  C.lines=cfg.lines;
}
const BG=[[0,0x0b132b],[cfgT=>0,0]];
function bgAt(t){ // fond de scène : nuit → bleu (retournement) → neige (solution)
  const tb=W(30)-.15, tl=W(39)-.2; // « Et le pire » / « Avec OS Alfred »
  const night=new THREE.Color(0x0b132b),blue=new THREE.Color(0x0066ff),snow=new THREE.Color(0xf4faff);
  if(t<tb)return {c:night,mode:'d'};
  if(t<tl){const k=eOut(seg(t,tb,tb+.35));return {c:night.clone().lerp(blue,k),mode:'d'}}
  const k=eOut(seg(t,tl,tl+.4));return {c:blue.clone().lerp(snow,k),mode:k>.5?'l':'d'}}

function render(t){
  const bg=bgAt(t);ground.material.opacity=bg.mode==='l'?.16:.5;
  document.getElementById('stage').style.background='#'+bg.c.getHexString();
  // repères
  const tR=W(11),tD=W(12),tF=W(13),tT=W(14),tM=W(19),tPire=W(30),tSans=W(33),tAvec=W(39),tTach=W(42),tMieux=W(49),tDec=W(54),tFeu=W(61),END=C.dur;
  // ---------- caméra
  let cp=new THREE.Vector3(0,9.5,7.2),tg=new THREE.Vector3(0,0,.4);
  const push=eIO(seg(t,0,tR));cp.lerp(new THREE.Vector3(0,7.2,5.2),push);
  if(t>=tR-.2){const k=eIO(seg(t,tR-.2,tM));cp=new THREE.Vector3(lerp(0,1.6,k),lerp(7.2,8.6,k),lerp(5.2,7.6,k));tg.set(lerp(0,.4,k),lerp(0,.6,k),lerp(.4,.2,k))}
  if(t>=tPire){const k=eIO(seg(t,tPire,tSans+.6));cp.set(lerp(1.6,0,k),lerp(8.6,10.5,k),lerp(7.6,5.5,k));tg.set(lerp(.4,0,k),lerp(.6,0,k),lerp(.2,-.3,k))}
  if(t>=tAvec){const k=eIO(seg(t,tAvec,tTach+.5));cp.set(0,lerp(10.5,8.4,k),lerp(5.5,6.4,k));tg.set(0,0,lerp(-.3,.2,k))}
  cp.x+=Math.sin(t*.6)*.12;cp.y+=Math.sin(t*.45)*.08; // respiration de caméra
  cam.position.copy(cp);cam.lookAt(tg);cam.setViewOffset(1080,1920,0,-120,1080,1920);
  rim.intensity=t<tPire?1.4:0;
  // ---------- téléphone
  const pin=eOut(seg(t,-.2,.6));
  const pout=eIn(seg(t,tAvec-.1,tAvec+.35));
  phone.position.set(0,lerp(-.2,0,pin)-pout*.1,lerp(-.2,.3,pin));
  phone.rotation.set(0,lerp(-.35,-.12,pin)+Math.sin(t*.7)*.03,0);
  phone.scale.setScalar(Math.max(.001,.78*(1-pout)));
  // le téléphone recule quand les tâches s'empilent
  const back=eIO(seg(t,tR-.1,tR+.6));phone.position.x=lerp(0,-1.05,back);phone.position.z+=lerp(0,-.6,back);phone.rotation.y-=back*.25;
  const ns=[{t:'Relance devis',s:'M. Dupont · sans réponse',c:'#ff8a3d',a:.35},{t:'Facture n° 2026-118',s:'à éditer ce soir',c:'#0066ff',a:.85},{t:'Tableau de suivi',s:'à mettre à jour',c:'#7c5cff',a:1.35}]
     .map(n=>({...n,k:eOut(seg(t,n.a,n.a+.35))})).filter(n=>n.k>0);
  drawPhone(t<tMieux?'22:00':'19:00',ns,t<tPire);
  // ---------- cartes : chaque carte tombe sur son mot, s'empile, puis s'automatise
  const hits=[tR,tD,tF,tT];
  cards.forEach((c,i)=>{const a=hits[i]-.12;const k=spring((t-a)*1.4);const vis=t>=a;
    const stackY=.1+i*.15, sx=.55+(i%2?.04:-.04), sz=.35;
    let x=sx,y=lerp(4.5,stackY,clamp(k)),z=sz,ry=lerp(.9,(i%2?.06:-.08),clamp(k)),rx=lerp(-.7,0,clamp(k));
    // retournement : les cartes se détachent et passent en orbite
    if(t>=tPire){const o=eIO(seg(t,tPire+.1+i*.08,tSans+.5));const ang=i/4*Math.PI*2+t*.9;
      x=lerp(x,Math.cos(ang)*1.05,o);z=lerp(z,Math.sin(ang)*.55-.2,o);y=lerp(y,.45+Math.sin(t*2+i)*.1,o);ry=lerp(ry,-ang,o);rx=lerp(rx,-.25,o)}
    // solution : aspirées dans la tuile « ton outil »
    let sc=1;if(t>=tAvec){const m=eIn(seg(t,tAvec+.05+i*.06,tTach+.1+i*.06));x=lerp(x,0,m);z=lerp(z,0,m);y=lerp(y,.4,m);sc=1-m}
    c.g.visible=vis&&sc>.01;c.g.position.set(x,y,z);c.g.rotation.set(rx,ry,0);c.g.scale.setScalar(Math.max(.001,sc)*.66*(1-.2*(t>=tPire?eIO(seg(t,tPire,tSans)):0))*(.9+.1*clamp(k)));
    const done=t>=tSans?eOut(seg(t,tSans+i*.12,tSans+.3+i*.12)):0;drawCard(c,done)});
  // ---------- tuile outil
  const ti=spring((t-tTach+.1)*1.3);tool.visible=t>tTach-.1;
  const tout=eIO(seg(t,tDec-.2,tDec+.5));
  tool.position.set(0,lerp(-.5,.2,clamp(ti)),lerp(1,0,clamp(ti))-tout*.3);tool.rotation.set(lerp(-.4,0,clamp(ti))+tout*.25,Math.sin(t*.5)*.05+tout*Math.sin(t*.8)*.12,0);tool.scale.setScalar(Math.max(.001,clamp(ti)*lerp(.72,.46,tout)));
  drawTool(seg(t,tTach+.2,tMieux));
  key.intensity=bg.mode==='l'?1.0:1.25;hemi.intensity=bg.mode==='l'?.9:.55;
  R.render(S,cam);
  // ---------- textes
  show(O.h1,t,-1,tR-.05);show(O.h2,t,-1,tR-.05);
  show(O.m1,t,tM-.05,tPire-.05);show(O.m2,t,W(24)-.05,tPire-.05);
  show(O.p1,t,tPire-.05,tSans-.12);show(O.p2,t,tSans-.05,tAvec-.05);
  show(O.s1,t,tTach-.05,tMieux-.05);show(O.s2,t,W(46)-.05,tMieux-.05);
  show(O.f1,t,tMieux-.05,tDec-.05);
  show(O.c1,t,tDec-.05,END+1);show(O.c2,t,W(57)-.05,END+1);show(O.c3,t,tFeu-.05,END+1);
  // le hook textuel est visible dès la 1re image (pas d'entrée)
  if(t<tR-.3){O.h1.style.opacity=1;O.h1.style.transform='none';O.h2.style.opacity=1;O.h2.style.transform='none'}
  
  // ---------- sous-titres (phrase courante, mot actif)
  const L=C.lines.find(l=>t>=W(l[0])-.08&&t<(l[2]??(l[1]+1<C.words.length?W(l[1]+1)-.05:END)));
  const cap=O.cap;ov.className=bg.mode==='l'?'capl':'capd';
  if(L&&!(t>=tDec)){let h='';for(let i=L[0];i<=L[1];i++){const on=t>=W(i)-.04;h+=`<span class="${on?'on':''}${C.key.includes(i)?' k2':''}">${C.words[i].text}</span>`}cap.innerHTML=h;cap.style.opacity=1}
  else cap.style.opacity=0;
}
window.build=build;window.render=render;
</script></body></html>
